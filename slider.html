<!-- Main Content -->
<div class="container mx-auto px-4 py-6">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <!-- Left Content -->
        <div class="lg:col-span-3">
            <!-- Image Slider - Set to 278px height -->
            <div class="relative overflow-hidden rounded-lg shadow-lg mb-6">
                <div class="flex transition-transform duration-500 ease-in-out" id="slider-container">
                    <img
                        src="https://bteb.gov.bd/sites/default/files/files/bteb.portal.gov.bd/top_banner/7699e582_282e_47e5_b32d_ec8847a6fbc1/banner_5.jpg"
                        alt="Slide 1"
                        class="w-full h-[278px] object-cover flex-shrink-0"
                    />
                    <img
                        src="https://bteb.gov.bd/sites/default/files/files/bteb.portal.gov.bd/top_banner/5ec989ca_d8e9_46ed_b805_9cba6ce0306b/karigori_2.JPG"
                        alt="Slide 2"
                        class="w-full h-[278px] object-cover flex-shrink-0"
                    />
                    <img
                        src="https://bteb.gov.bd/sites/default/files/files/bteb.portal.gov.bd/top_banner/ed35ebea_1ddd_429f_815c_754870140d0f/karigori_3.jpg"
                        alt="Slide 3"
                        class="w-full h-[278px] object-cover flex-shrink-0"
                    />
                </div>
                <button
                    onclick="previousSlide()"
                    class="absolute left-4 top-1/2 transform -translate-y-1/2 bg-black bg-opacity-50 text-white p-2 rounded-full hover:bg-opacity-70 transition-all"
                >
                    <i data-lucide="chevron-left" class="h-5 w-5"></i>
                </button>
                <button
                    onclick="nextSlide()"
                    class="absolute right-4 top-1/2 transform -translate-y-1/2 bg-black bg-opacity-50 text-white p-2 rounded-full hover:bg-opacity-70 transition-all"
                >
                    <i data-lucide="chevron-right" class="h-5 w-5"></i>
                </button>
                <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex space-x-2" id="slider-dots">
                    <button onclick="goToSlide(0)" class="w-3 h-3 rounded-full bg-white transition-all slider-dot active"></button>
                    <button onclick="goToSlide(1)" class="w-3 h-3 rounded-full bg-white bg-opacity-50 transition-all slider-dot"></button>
                    <button onclick="goToSlide(2)" class="w-3 h-3 rounded-full bg-white bg-opacity-50 transition-all slider-dot"></button>
                </div>
            </div>

<script>
let currentSlide = 0;
const totalSlides = 3;
let slideInterval;

function updateSlider() {
    const container = document.getElementById('slider-container');
    const dots = document.querySelectorAll('.slider-dot');
    
    container.style.transform = `translateX(-${currentSlide * 100}%)`;
    
    dots.forEach((dot, index) => {
        if (index === currentSlide) {
            dot.classList.add('active');
            dot.classList.remove('bg-opacity-50');
        } else {
            dot.classList.remove('active');
            dot.classList.add('bg-opacity-50');
        }
    });
}

function nextSlide() {
    currentSlide = (currentSlide + 1) % totalSlides;
    updateSlider();
}

function previousSlide() {
    currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
    updateSlider();
}

function goToSlide(index) {
    currentSlide = index;
    updateSlider();
}

function startSlideShow() {
    slideInterval = setInterval(nextSlide, 3000);
}

function stopSlideShow() {
    clearInterval(slideInterval);
}

// Auto-play slider
document.addEventListener('DOMContentLoaded', function() {
    startSlideShow();
    lucide.createIcons();
});

// Pause on hover
document.querySelector('.relative.overflow-hidden').addEventListener('mouseenter', stopSlideShow);
document.querySelector('.relative.overflow-hidden').addEventListener('mouseleave', startSlideShow);
</script>
